name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
      SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore
        shell: bash
        run: printf '%s' '${{ secrets.RELEASE_KEYSTORE_BASE64 }}' | base64 --decode > "$SIGNING_STORE_FILE"
      - name: Build signed release APK
        env:
          APP_VERSION_NAME: ${{ env.RELEASE_TAG }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          APP_VERSION_NAME="${APP_VERSION_NAME#v}" ./gradlew --no-daemon test :app:lintRelease :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "swap-calendar-${RELEASE_TAG}.apk"
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "swap-calendar-${RELEASE_TAG}.apk"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" "swap-calendar-${RELEASE_TAG}.apk" --verify-tag --generate-notes --title "Swap Calendar $RELEASE_TAG"
      - name: Remove signing material
        if: always()
        run: rm -f "$SIGNING_STORE_FILE"
