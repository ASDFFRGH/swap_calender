services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swap_calendar
      POSTGRES_USER: swap_calendar
      POSTGRES_PASSWORD: swap_calendar
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swap_calendar"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - swap-calendar-postgres:/var/lib/postgresql/data

volumes:
  swap-calendar-postgres:
